<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex 额度面板</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --panel: #ffffff;
        --ink: #1f2328;
        --muted: #69707d;
        --line: #d9dee7;
        --blue: #2563eb;
        --green: #16825d;
        --amber: #b7791f;
        --red: #c2413b;
        --shadow: 0 10px 28px rgba(20, 31, 48, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .shell {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        padding: 8px 0 22px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 760;
        letter-spacing: 0;
      }

      .meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      button {
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        padding: 0 14px;
        font: inherit;
        cursor: pointer;
      }

      select {
        height: 38px;
        min-width: 190px;
        max-width: 280px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        padding: 0 32px 0 12px;
        font: inherit;
      }

      button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: white;
      }

      main {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        padding-top: 22px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .tile,
      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .tile {
        min-height: 106px;
        padding: 16px;
      }

      .label {
        color: var(--muted);
        font-size: 13px;
      }

      .value {
        margin-top: 8px;
        font-size: 26px;
        font-weight: 760;
        line-height: 1.1;
      }

      .hint {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .panel {
        padding: 18px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      h2 {
        margin: 0;
        font-size: 17px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .limits {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .limit-row {
        min-width: 0;
      }

      .limit-row:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .limit-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .pill {
        border-radius: 999px;
        padding: 3px 8px;
        background: #edf2ff;
        color: #2549a8;
        font-size: 12px;
        white-space: nowrap;
      }

      .bar {
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8ebf0;
      }

      .fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: var(--green);
        transition: width 220ms ease;
      }

      .fill.warn {
        background: var(--amber);
      }

      .fill.danger {
        background: var(--red);
      }

      .window-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .window {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }

      .window > .hint {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 650;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .error {
        display: none;
        border: 1px solid #f0b5b0;
        background: #fff7f6;
        color: #9f2f2b;
        border-radius: 8px;
        padding: 12px 14px;
      }

      .error.notice {
        border-color: #e5c37a;
        background: #fffaf0;
        color: #805b14;
      }

      .chart-wrap {
        min-height: 280px;
        overflow-x: auto;
      }

      .chart {
        display: block;
        width: 100%;
        min-width: 680px;
        height: 280px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .legend span::before {
        content: "";
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--series-color);
      }

      @media (max-width: 860px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .summary,
        .limits,
        .window-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <h1>Codex 额度面板</h1>
          <div class="meta" id="account">正在读取本机登录态...</div>
        </div>
        <div class="actions">
          <select id="accountSelect" aria-label="选择监控账号" hidden></select>
          <button id="refresh" class="primary">刷新</button>
        </div>
      </header>

      <main>
        <div class="error" id="error"></div>

        <section class="summary">
          <div class="tile">
            <div class="label">计划</div>
            <div class="value" id="plan">-</div>
            <div class="hint">ChatGPT 账号对应的 Codex plan</div>
          </div>
          <div class="tile" id="mainWindow1Tile">
            <div class="label" id="mainWindow1Label">主额度</div>
            <div class="value" id="mainWindow1">-</div>
            <div class="hint" id="mainWindow1Reset">-</div>
          </div>
          <div class="tile" id="mainWindow2Tile">
            <div class="label" id="mainWindow2Label">主额度</div>
            <div class="value" id="mainWindow2">-</div>
            <div class="hint" id="mainWindow2Reset">-</div>
          </div>
          <div class="tile">
            <div class="label">重置卡</div>
            <div class="value" id="creditCount">-</div>
            <div class="hint">可用 Full reset 数量</div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>额度窗口</h2>
          </div>
          <div class="limits" id="limits"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>额度消耗趋势</h2>
              <div class="hint">最近 24 小时的成功采样；读取失败不会新增记录</div>
            </div>
            <div class="legend" id="historyLegend"></div>
          </div>
          <div class="chart-wrap" id="historyChart"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>重置卡到期时间</h2>
          </div>
          <table>
            <thead>
              <tr>
                <th>状态</th>
                <th>类型</th>
                <th>获得时间</th>
                <th>到期时间</th>
                <th>剩余</th>
              </tr>
            </thead>
            <tbody id="credits"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script>
      const el = (id) => document.getElementById(id);
      const seriesColors = ["#2563eb", "#16825d", "#b7791f", "#c2413b", "#7c3aed"];
      let loadVersion = 0;

      function codexApiUrl(cached = false, accountName = el("accountSelect").value) {
        const parameters = new URLSearchParams();
        if (cached) parameters.set("cached", "1");
        if (accountName) parameters.set("account", accountName);
        return `/api/codex?${parameters.toString()}`;
      }

      async function loadAccounts() {
        try {
          const response = await fetch("/api/accounts", { cache: "no-store" });
          if (!response.ok) return;
          const data = await response.json();
          const accounts = data.accounts || [];
          if (!accounts.length) return;
          const selector = el("accountSelect");
          selector.innerHTML = accounts.map((account) => {
            const state = account.is_active
              ? " · 当前登录"
              : account.is_current ? " · 顶栏主账号" : "";
            return `<option value="${escapeHtml(account.name)}" ${account.available ? "" : "disabled"}>${escapeHtml(account.display_name + state)}</option>`;
          }).join("");
          const preferred = accounts.find(
            (account) => account.name === data.default_account && account.available
          ) || accounts.find((account) => account.available);
          if (!preferred) return;
          selector.value = preferred.name;
          selector.hidden = false;
        } catch (error) {
          // 多账号列表不影响当前登录账号的额度查询。
        }
      }

      function fmtTime(value) {
        if (!value) return "-";
        return new Date(value).toLocaleString("zh-CN", { hour12: false });
      }

      function fmtShortUnix(seconds) {
        if (!seconds) return "-";
        const date = new Date(seconds * 1000);
        const hours = String(date.getHours()).padStart(2, "0");
        const minutes = String(date.getMinutes()).padStart(2, "0");
        return `${date.getMonth() + 1}/${date.getDate()} ${hours}:${minutes}`;
      }

      function fmtDuration(seconds) {
        if (seconds == null) return "-";
        if (seconds <= 0) return "已到期";
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const parts = [];
        if (d) parts.push(`${d}天`);
        if (h) parts.push(`${h}小时`);
        if (m || !parts.length) parts.push(`${m}分钟`);
        return parts.join("");
      }

      function fmtCompactDuration(seconds) {
        if (seconds == null) return "-";
        if (seconds <= 0) return "已到期";
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        if (d) return `${d}天${h ? `${h}小时` : ""}`;
        if (h) return `${h}小时${m ? `${m}分钟` : ""}`;
        return `${Math.max(1, m)}分钟`;
      }

      function pct(value) {
        return Number.isFinite(Number(value)) ? Number(value) : 0;
      }

      function mainDisplayWindows(section) {
        const windows = [...(section?.windows || [])];
        const hasFiveHourWindow = windows.some(
          (item) => Number(item.window?.limit_window_seconds) === 5 * 3600
        );
        if (!hasFiveHourWindow) {
          windows.push({
            label: "5 小时",
            window: { limit_window_seconds: 5 * 3600, unlimited: true },
          });
          windows.sort(
            (a, b) => Number(a.window?.limit_window_seconds) - Number(b.window?.limit_window_seconds)
          );
        }
        return windows;
      }

      function barClass(used) {
        if (used >= 85) return "danger";
        if (used >= 65) return "warn";
        return "";
      }

      function windowBlock(label, win) {
        if (win?.unlimited) {
          return `
            <div class="window">
              <div class="limit-title">
                <span>${label}</span>
                <span class="pill">无限额</span>
              </div>
              <div class="hint">该账号无 5 小时额度限制</div>
            </div>`;
        }
        const used = pct(win?.used_percent);
        const resetText = `${fmtCompactDuration(win?.reset_after_seconds)}后重置 · ${fmtShortUnix(win?.reset_at)}`;
        return `
          <div class="window">
            <div class="limit-title">
              <span>${label}</span>
              <span class="pill">剩余约 ${Math.max(0, 100 - used)}%</span>
            </div>
            <div class="bar"><div class="fill ${barClass(used)}" style="width:${used}%"></div></div>
            <div class="hint" title="${resetText}">${resetText}</div>
          </div>`;
      }

      function limitSection(section, includeUnlimitedFiveHour = false) {
        const windows = includeUnlimitedFiveHour
          ? mainDisplayWindows(section)
          : section.windows || [];
        return `
          <div class="limit-row">
            <div class="limit-title">
              <span>${escapeHtml(section.title)}</span>
              <span class="pill">${section.limit_reached ? "已触顶" : "可用"}</span>
            </div>
            <div class="window-grid">
              ${windows.length
                ? windows.map((item) => windowBlock(`${item.label}窗口`, item.window)).join("")
                : '<div class="hint">暂无额度窗口</div>'}
            </div>
          </div>`;
      }

      function renderMainSummary(mainSection) {
        const windows = mainDisplayWindows(mainSection);
        [0, 1].forEach((index) => {
          const number = index + 1;
          const tile = el(`mainWindow${number}Tile`);
          const item = windows[index];
          const win = item?.window;
          tile.style.display = item ? "" : "none";
          if (!item) return;
          el(`mainWindow${number}Label`).textContent = `主额度 · ${item.label}`;
          el(`mainWindow${number}`).textContent = win?.unlimited
            ? "无限额"
            : `${pct(win.used_percent)}%`;
          el(`mainWindow${number}Reset`).textContent = win?.unlimited
            ? "该账号无 5 小时额度限制"
            : `${fmtCompactDuration(win.reset_after_seconds)}后重置`;
        });
      }

      function render(data) {
        el("error").style.display = "none";
        el("error").classList.remove("notice");
        const usage = data.usage || {};
        const resetCredits = data.reset_credits || {};
        const sections = data.quota_sections || [];
        const mainSection = sections.find((section) => section.key === "main") || {
          key: "main", title: "主额度", windows: []
        };
        const credits = resetCredits.credits || [];

        el("account").textContent = `${usage.email || "-"} · ${usage.account_id || "-"}`;
        el("plan").textContent = usage.plan_type || "-";
        renderMainSummary(mainSection);
        el("creditCount").textContent = String(usage.rate_limit_reset_credits?.available_count ?? credits.length);
        el("limits").innerHTML =
          sections.map((section) => limitSection(section, section.key === "main")).join("");

        el("credits").innerHTML = credits.length
          ? credits
              .map((credit) => {
                const expires = credit.expires_at ? new Date(credit.expires_at) : null;
                const remaining = expires ? fmtDuration(Math.floor((expires - Date.now()) / 1000)) : "-";
                return `<tr>
                  <td>${credit.status || "-"}</td>
                  <td>${credit.title || "-"}</td>
                  <td>${fmtTime(credit.granted_at)}</td>
                  <td>${fmtTime(credit.expires_at)}</td>
                  <td>${remaining}</td>
                </tr>`;
              })
              .join("")
          : '<tr><td colspan="5">没有可显示的重置卡</td></tr>';

        renderHistory(data.history || []);
        const meta = data.meta || {};
        if (meta.initial_cache) {
          const ageMinutes = Math.max(0, Math.floor((Date.now() / 1000 - meta.observed_at) / 60));
          el("error").classList.add("notice");
          el("error").textContent = `已先显示${ageMinutes ? `${ageMinutes} 分钟前` : "刚刚"}的本地快照，正在后台更新…`;
          el("error").style.display = "block";
        } else if (meta.cached) {
          const ageMinutes = Math.max(0, Math.floor((Date.now() / 1000 - meta.observed_at) / 60));
          el("error").classList.add("notice");
          el("error").textContent = `当前接口读取失败，显示 ${ageMinutes ? `${ageMinutes} 分钟前` : "刚刚"}的缓存数据；缓存超过 10 分钟后将停止显示。`;
          el("error").style.display = "block";
        } else if (meta.reset_error) {
          el("error").classList.add("notice");
          el("error").textContent = "额度已更新，但重置卡暂时读取失败。";
          el("error").style.display = "block";
        }
      }

      function renderHistory(rows) {
        const chart = el("historyChart");
        const legend = el("historyLegend");
        if (!rows.length) {
          chart.innerHTML = '<div class="hint">暂无历史数据，等待成功刷新后自动记录。</div>';
          legend.innerHTML = "";
          return;
        }
        const grouped = new Map();
        rows.forEach((row) => {
          if (!grouped.has(row.window_key)) grouped.set(row.window_key, []);
          grouped.get(row.window_key).push(row);
        });
        const width = 1000;
        const height = 260;
        const left = 48;
        const right = 18;
        const top = 14;
        const bottom = 34;
        const timestamps = rows.map((row) => Number(row.observed_at));
        const minTime = Math.min(...timestamps);
        const maxTime = Math.max(...timestamps);
        const span = Math.max(1, maxTime - minTime);
        const x = (value) => left + ((Number(value) - minTime) / span) * (width - left - right);
        const y = (value) => top + (1 - Math.max(0, Math.min(100, Number(value))) / 100) * (height - top - bottom);
        const grid = [0, 25, 50, 75, 100].map((value) => {
          const py = y(value);
          return `<line x1="${left}" y1="${py}" x2="${width - right}" y2="${py}" stroke="#e2e6ec" />
            <text x="${left - 9}" y="${py + 4}" text-anchor="end" fill="#69707d" font-size="12">${value}%</text>`;
        }).join("");
        const paths = [...grouped.entries()].map(([key, points], index) => {
          const color = seriesColors[index % seriesColors.length];
          const path = points.map((point, pointIndex) => `${pointIndex ? "L" : "M"}${x(point.observed_at).toFixed(1)},${y(point.used_percent).toFixed(1)}`).join(" ");
          return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />`;
        }).join("");
        const startLabel = new Date(minTime * 1000).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
        const endLabel = new Date(maxTime * 1000).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
        chart.innerHTML = `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="额度消耗趋势图">
          ${grid}${paths}
          <text x="${left}" y="${height - 8}" fill="#69707d" font-size="12">${startLabel}</text>
          <text x="${width - right}" y="${height - 8}" text-anchor="end" fill="#69707d" font-size="12">${endLabel}</text>
        </svg>`;
        legend.innerHTML = [...grouped.values()].map((points, index) =>
          `<span style="--series-color:${seriesColors[index % seriesColors.length]}">${escapeHtml(points[0].label)}</span>`
        ).join("");
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
      }

      async function load() {
        const version = ++loadVersion;
        const accountName = el("accountSelect").value;
        el("error").style.display = "none";
        el("error").classList.remove("notice");
        el("refresh").disabled = true;
        try {
          try {
            const cachedResponse = await fetch(codexApiUrl(true, accountName), { cache: "no-store" });
            if (cachedResponse.ok) {
              const cachedData = await cachedResponse.json();
              if (version === loadVersion) render(cachedData);
            }
          } catch (error) {
            // 本地快照只是首屏加速，失败时继续请求实时数据。
          }
          const response = await fetch(codexApiUrl(false, accountName), { cache: "no-store" });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "读取失败");
          if (version === loadVersion) render(data);
        } catch (error) {
          if (version === loadVersion) {
            el("error").textContent = error.message;
            el("error").style.display = "block";
          }
        } finally {
          if (version === loadVersion) el("refresh").disabled = false;
        }
      }

      el("refresh").addEventListener("click", load);
      el("accountSelect").addEventListener("change", load);
      async function initialize() {
        await loadAccounts();
        await load();
      }
      initialize();
      setInterval(load, 60_000);
    </script>
  </body>
</html>
